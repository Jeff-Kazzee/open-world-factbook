# Application setup change: keep separate from dependency/runtime remediation.
# review-gate reads the workflow named ci; this workflow does not deploy.
name: ci

on:
  pull_request:
  push:
    branches: [dev, prod]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # Fail if the locked optional binding is absent; do not download a fallback.
  SKIP_UNRS_RESOLVER_FALLBACK: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Verify the validated toolchain
        run: |
          node --version | grep -x 'v24.22.3'
          npm --version | grep -x '11.19.1'
      - name: Install the locked npm graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Check the native resolver binding
        run: node -e "require('@unrs/resolver-binding-linux-x64-gnu'); require('unrs-resolver')"
      - name: Check the scoped lint dependency override
        run: node scripts/check-lint-compatibility.mjs
      - name: Audit the complete locked dependency graph
        run: npm audit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Build
        run: npm run build
      - name: Smoke test production routes on loopback
        run: |
          server_log="$RUNNER_TEMP/factbook-next.log"
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 4317 >"$server_log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cat "$server_log"' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          const origin = 'http://127.0.0.1:4317';
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try {
              const response = await fetch(origin, { signal: AbortSignal.timeout(1000) });
              await response.arrayBuffer();
              if (response.status === 200) {
                ready = true;
                break;
              }
            } catch {
              // The server may still be starting.
            }
            await delay(500);
          }
          assert.ok(ready, 'Production server did not become ready');
          for (const [route, expected] of [
            ['/', 200], ['/countries', 200], ['/about', 200],
            ['/api-docs', 200], ['/contribute', 200],
            ['/region/east-n-southeast-asia', 200], ['/country/japan', 200],
            ['/country/ci-unknown-country', 404], ['/region/ci-unknown-region', 404],
          ]) {
            const response = await fetch(origin + route, { signal: AbortSignal.timeout(10000) });
            const body = await response.text();
            assert.equal(response.status, expected, route);
            if (route === '/country/japan') assert.match(body, /<h1\b[^>]*>\s*Japan\s*<\/h1>/);
            console.log(`${route}: ${response.status}`);
          }
          NODE
